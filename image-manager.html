<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Manager — Sliding In</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Blogger+Sans:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {--bg:#1c1c1c;--text:#e8e8e8;--accent:#a3e635;}
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
        .topbar {position:sticky;top:0;background:rgba(28,28,28,.95);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;border-bottom:1px solid #333;}
        .topbar-logo {font-family:monospace;font-size:1rem;font-weight:700;color:var(--text);}
        .topbar-logo span {color:var(--accent);}
        .topbar-stats {font-size:.85rem;color:var(--text-muted);}
        .topbar-stats strong {color:var(--accent);}
        .container {max-width:900px;margin:0 auto;padding:20px;}
        .topic-nav {display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
        .topic-nav button {padding:6px 14px;border:1px solid #333;background:#232323;color:#e8e8e8;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .15s;}
        .topic-nav button:hover {border-color:var(--accent);}
        .topic-nav button.active {background:var(--accent);color:#1c1c1c;font-weight:700;}
        .topic-nav .nav-arrow {font-size:1.2rem;padding:6px 10px;}
        .topic-card {background:#232323;border:1px solid #333;border-radius:12px;padding:24px;margin-bottom:16px;}
        .topic-card h2 {font-family:monospace;font-size:1.1rem;margin-bottom:4px;}
        .topic-card .meta {font-size:.75rem;color:#999;margin-bottom:16px;}
        .image-slots {display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
        .image-slot {background:#1a1a1a;border:1px dashed #444;border-radius:8px;padding:12px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
        .image-slot img {max-width:100%;max-height:140px;border-radius:6px;margin-bottom:8px;}
        .image-slot .placeholder {font-size:.7rem;color:#555;}
        .image-slot input {width:100%;padding:6px 10px;background:#1c1c1c;border:1px solid #333;border-radius:6px;color:#e8e8e8;font-size:.75rem;margin-top:4px;}
        .image-slot input:focus {border-color:var(--accent);outline:none;}
        .image-slot .remove-btn {margin-top:6px;padding:4px 10px;background:#333;border:1px solid #444;border-radius:4px;color:#999;cursor:pointer;font-size:.7rem;}
        .image-slot .remove-btn:hover {background:#444;color:#e8e8e8;}
        .save-btn {padding:10px 24px;background:var(--accent);color:#1c1c1c;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem;transition:all .15s;}
        .save-btn:hover {opacity:.9;}
        .unsplash-link {font-size:.75rem;color:#999;margin-top:8px;}
        .unsplash-link a {color:var(--accent);text-decoration:none;}
        .progress-bar {height:4px;background:#333;border-radius:2px;margin-bottom:20px;overflow:hidden;}
        .progress-bar .fill {height:100%;background:var(--accent);transition:width .3s;}
        .category-badge {display:inline-block;padding:2px 8px;background:#333;border-radius:4px;font-size:.65rem;color:#999;margin-left:8px;}
    </style>
</head>
<body>

        <div class="topbar-logo">Image <span>Manager</span></div>
        <div class="topbar-stats"><strong id="statDone">0</strong> / <span id="statTotal">0</span> topics with images</div>
    </div>
    <div class="container">
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <div class="topic-nav" id="topicNav"></div>
        <div id="topicCard"></div>
        <div class="unsplash-link">Find images: <a href="https://unsplash.com" target="_blank">unsplash.com</a> — right-click image → Copy image address</div>

        var topicImages = {};
        var currentIdx = 0;
        
        function init() {
            loadSavedImages();
            renderNav();
            renderTopic();
            updateStats();
        }
        
        function loadSavedImages() {
            try {
                var saved = localStorage.getItem("slidingInImages");
                if (saved) topicImages = JSON.parse(saved);
            } catch(e) {}
        }
        
        function saveImages() {
            localStorage.setItem("slidingInImages", JSON.stringify(topicImages));
            updateStats();
        }
        
        function updateStats() {
            var done = 0;
            for (var key in topicImages) {
                if (topicImages[key] && topicImages[key].filter(function(u){return u;}).length > 0) done++;
            }
            document.getElementById("statDone").textContent = done;
            document.getElementById("statTotal").textContent = ALL_TOPICS.length;
            var pct = ALL_TOPICS.length > 0 ? (done / ALL_TOPICS.length * 100) : 0;
            document.getElementById("progressFill").style.width = pct + "%";
        }
        
        function renderNav() {
            var nav = document.getElementById("topicNav");
            nav.innerHTML = "";
            var prevBtn = document.createElement("button");
            prevBtn.className = "nav-arrow";
            prevBtn.innerHTML = "◀";
            prevBtn.onclick = function() { if (currentIdx > 0) { currentIdx--; renderTopic(); renderNav(); } };
            nav.appendChild(prevBtn);
            
            var select = document.createElement("select");
            select.style.cssText = "padding:6px 12px;background:#232323;border:1px solid #333;border-radius:8px;color:#e8e8e8;font-size:.8rem;";
            ALL_TOPICS.forEach(function(t, i) {
                var opt = document.createElement("option");
                opt.value = i;
                opt.textContent = (i+1) + ". " + t.title;
                if (i === currentIdx) opt.selected = true;
                select.appendChild(opt);
            });
            select.onchange = function() { currentIdx = parseInt(this.value); renderTopic(); };
            nav.appendChild(select);
            
            var nextBtn = document.createElement("button");
            nextBtn.className = "nav-arrow";
            nextBtn.innerHTML = "▶";
            nextBtn.onclick = function() { if (currentIdx < ALL_TOPICS.length-1) { currentIdx++; renderTopic(); renderNav(); } };
            nav.appendChild(nextBtn);
        }
        
        function renderTopic() {
            var topic = ALL_TOPICS[currentIdx];
            var card = document.getElementById("topicCard");
            var slug = topic.slug;
            var imgs = topicImages[slug] || ["", "", ""];
            
            var html = "";
            html += '<div class="topic-card">';
            html += '<h2>' + (currentIdx+1) + '. ' + topic.title + '<span class="category-badge">' + topic.category + '</span></h2>';
            html += '<div class="meta">' + topic.questions + ' questions · Slug: ' + slug + '</div>';
            html += '<div class="image-slots">';
            for (var i = 0; i < 3; i++) {
                html += '<div class="image-slot" id="slot' + i + '">';
                if (imgs[i]) {
                    html += '<img src="' + imgs[i] + '" alt="Image ' + (i+1) + '" onerror="this.style.display=\'none\'">';
                } else {
                    html += '<div class="placeholder">Image ' + (i+1) + '<br><small>Paste URL below</small></div>';
                }
                html += '<input type="text" placeholder="Paste Unsplash URL..." value="' + (imgs[i] || "") + '" onchange="updateImage(' + i + ', this.value)">';
                if (imgs[i]) {
                    html += '<button class="remove-btn" onclick="removeImage(' + i + ')">Remove</button>';
                }
                html += '</div>';
            }
            html += '</div>';
            html += '<button class="save-btn" onclick="saveImages()">Save All Images</button>';
            html += '</div>';
            card.innerHTML = html;
        }
        
        function updateImage(idx, url) {
            var slug = ALL_TOPICS[currentIdx].slug;
            if (!topicImages[slug]) topicImages[slug] = ["", "", ""];
            topicImages[slug][idx] = url.trim();
            renderTopic();
        }
        
        function removeImage(idx) {
            var slug = ALL_TOPICS[currentIdx].slug;
            if (topicImages[slug]) topicImages[slug][idx] = "";
            renderTopic();
        }
        
        init();
    </script>
